server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:IoTeca}
    username: ${DB_USER:IoTeca_app}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: platform
        format_sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:changeme-min-32-chars-for-dev-only}
  expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    io.ioteca: INFO
    org.springframework.security: WARN

spring:
  datasource:
    url: jdbc:postgresql://localhost:5437/ioteca
    username: ioteca
    password: testpwd
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-init.sql
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: platform
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6380
      password: testpwd
      timeout: 2s
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: quota-it-group
      auto-offset-reset: latest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    org.hibernate: WARN
    org.springframework.kafka: WARN

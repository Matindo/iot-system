name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ioteca

jobs:

  # ── Frontend ──────────────────────────────────────────────────────────────

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  # ── Go (mqtt-bridge) ──────────────────────────────────────────────────────

  test-mqtt-bridge:
    name: mqtt-bridge unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mqtt-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/mqtt-bridge/go.sum

      - run: go test -v -count=1 ./...

  # ── Java unit tests (one job per service, run in parallel) ────────────────

  test-java:
    name: Unit tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - api-gateway
          - ingestion-service
          - alert-engine
          - quota-service
          - notification-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.service }}-${{ hashFiles(format('services/{0}/pom.xml', matrix.service)) }}
          restore-keys: ${{ runner.os }}-maven-${{ matrix.service }}-

      - run: mvn test -q

  # ── Integration tests ────────────────────────────────────────────────────

  integration-tests:
    name: Integration tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-java, test-frontend, test-mqtt-bridge]
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - api-gateway
          - ingestion-service
          - alert-engine
          - quota-service
          - notification-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      auth-test-db:
        image: timescale/timescaledb:latest-pg16
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: ioteca
          POSTGRES_USER: ioteca
          POSTGRES_PASSWORD: testpwd
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      gateway-test-db:
        image: postgres:16
        ports:
          - 5434:5432
        env:
          POSTGRES_DB: ioteca
          POSTGRES_USER: ioteca
          POSTGRES_PASSWORD: testpwd
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      ingestion-test-db:
        image: postgres:16
        ports:
          - 5435:5432
        env:
          POSTGRES_DB: ioteca
          POSTGRES_USER: ioteca
          POSTGRES_PASSWORD: testpwd
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      alert-test-db:
        image: postgres:16
        ports:
          - 5436:5432
        env:
          POSTGRES_DB: ioteca
          POSTGRES_USER: ioteca
          POSTGRES_PASSWORD: testpwd
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      quota-test-db:
        image: postgres:16
        ports:
          - 5437:5432
        env:
          POSTGRES_DB: ioteca
          POSTGRES_USER: ioteca
          POSTGRES_PASSWORD: testpwd
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      notification-test-db:
        image: postgres:16
        ports:
          - 5438:5432
        env:
          POSTGRES_DB: ioteca
          POSTGRES_USER: ioteca
          POSTGRES_PASSWORD: testpwd
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kafka-test:
        image: apache/kafka:3.9.0
        ports:
          - 19092:19092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://localhost:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
      redis-test:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.service }}-${{ hashFiles(format('services/{0}/pom.xml', matrix.service)) }}
          restore-keys: ${{ runner.os }}-maven-${{ matrix.service }}-

      - name: Run integration tests
        run: mvn verify -DskipTests=false -q

  # ── Build & push Docker images (parallel per service, only on main) ───────

  build-and-push:
    name: Build & push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: services/auth-service
          - service: api-gateway
            context: services/api-gateway
          - service: ingestion-service
            context: services/ingestion-service
          - service: alert-engine
            context: services/alert-engine
          - service: quota-service
            context: services/quota-service
          - service: notification-service
            context: services/notification-service
          - service: mqtt-bridge
            context: services/mqtt-bridge
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

services:
  auth-test-db:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ioteca
      POSTGRES_USER: ioteca
      POSTGRES_PASSWORD: testpwd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioteca -d ioteca"]
      interval: 5s
      timeout: 5s
      retries: 10


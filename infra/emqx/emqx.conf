node {
  name = "emqx@127.0.0.1"
  cookie = "IoTeca-emqx-cookie"
  data_dir = "/var/lib/emqx"
}

cluster {
  name = IoTeca
  discovery_strategy = manual
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 100000
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 100000
  ssl_options {
    keyfile  = "/etc/emqx/certs/server.key"
    certfile = "/etc/emqx/certs/server.crt"
    cacertfile = "/etc/emqx/certs/ca.crt"
  }
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
}

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://auth-service:8081/api/internal/emqx/auth"
    headers { "Content-Type" = "application/json" }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://auth-service:8081/api/internal/emqx/acl"
      headers { "Content-Type" = "application/json" }
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
    }
  ]
}

bridges.kafka.IoTeca {
  enable = true
  bootstrap_hosts = "kafka:9092"
  producer {
    topic_mapping = [
      {
        mqtt_topic = "IoTeca/#"
        kafka_topic = "raw.ingest.af-ke-1"
        qos = 1
      }
    ]
  }
}

name: ioteca

networks:
  ioteca:
    driver: bridge

volumes:
  timescaledb-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  emqx-data:

services:

  # ── Infrastructure ──────────────────────────────────────────────

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ioteca
      POSTGRES_USER: ioteca
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    networks: [ioteca]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [ioteca]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper
    networks: [ioteca]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [ioteca]

  emqx:
    image: emqx/emqx:5.6.0
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
      - "8083:8083"
      - "127.0.0.1:18083:18083"
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
    volumes:
      - emqx-data:/var/lib/emqx
      - ./infra/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    networks: [ioteca]

  # ── Backend Services ─────────────────────────────────────────────

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    env_file: .env
    depends_on: [timescaledb]
    networks: [ioteca]

  ingestion-service:
    build: ./services/ingestion-service
    restart: unless-stopped
    env_file: .env
    depends_on: [kafka, timescaledb]
    networks: [ioteca]

  alert-engine:
    build: ./services/alert-engine
    restart: unless-stopped
    env_file: .env
    depends_on: [kafka, timescaledb]
    networks: [ioteca]

  quota-service:
    build: ./services/quota-service
    restart: unless-stopped
    env_file: .env
    depends_on: [kafka, redis]
    networks: [ioteca]

  notification-service:
    build: ./services/notification-service
    restart: unless-stopped
    env_file: .env
    depends_on: [kafka]
    networks: [ioteca]

  api-gateway:
    build: ./services/api-gateway
    restart: unless-stopped
    env_file: .env
    depends_on: [auth-service, timescaledb, redis]
    ports:
      - "8080:8080"
    networks: [ioteca]

  # ── Frontend ─────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks: [ioteca]

name: ioteca

networks:
  ioteca:
    driver: bridge

volumes:
  timescaledb-data:
  redis-data:
  kafka-data:
  emqx-data:

configs:
  emqx_conf:
    content: |
      node {
        name = "emqx@127.0.0.1"
        cookie = "IoTeca-emqx-cookie"
        data_dir = "/opt/emqx/data"
      }

      cluster {
        name = IoTeca
        discovery_strategy = manual
      }

      listeners.tcp.default {
        bind = "0.0.0.0:1883"
        max_connections = 100000
      }

      listeners.ws.default {
        bind = "0.0.0.0:8083"
      }

      authentication = [
        {
          mechanism = password_based
          backend = http
          method = post
          url = "http://auth-service:8081/api/internal/emqx/auth"
          headers { "Content-Type" = "application/json" }
          body {
            username = "$${username}"
            password = "$${password}"
            clientid = "$${clientid}"
          }
        }
      ]

      authorization {
        no_match = deny
        deny_action = disconnect
        sources = [
          {
            type = http
            enable = true
            method = post
            url = "http://auth-service:8081/api/internal/emqx/acl"
            headers { "Content-Type" = "application/json" }
            body {
              username = "$${username}"
              topic = "$${topic}"
              action = "$${action}"
            }
          }
        ]
      }

      bridges.webhook.ioteca_ingest {
        enable = true
        url = "http://mqtt-bridge:8090/ingest"
        method = post
        headers {
          "content-type" = "application/json"
          "x-emqx-secret" = "${EMQX_INTERNAL_SECRET}"
        }
        body = "$${.}"
      }

      rule_engine {
        rules {
          device_mqtt_ingest {
            enable = true
            sql = "SELECT username as project_id, json_decode(payload) as payload FROM \"ioteca/#\""
            actions = ["webhook:ioteca_ingest"]
          }
        }
      }

services:

  # ── Infrastructure ──────────────────────────────────────────────

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ioteca
      POSTGRES_USER: ioteca
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioteca -d ioteca"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [ioteca]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [ioteca]

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [ioteca]

  emqx:
    image: emqx/emqx:5.6.0
    restart: unless-stopped
    user: root
    ports:
      - "1883:1883"
      - "8083:8083"
      - "127.0.0.1:18083:18083"
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_INTERNAL_SECRET: ${EMQX_INTERNAL_SECRET}
    volumes:
      - emqx-data:/opt/emqx/data
    configs:
      - source: emqx_conf
        target: /opt/emqx/etc/emqx.conf
    depends_on:
      auth-service:
        condition: service_healthy
      mqtt-bridge:
        condition: service_started
    networks: [ioteca]

  # ── Backend Services ─────────────────────────────────────────────

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [ioteca]

  ingestion-service:
    build: ./services/ingestion-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [ioteca]

  alert-engine:
    build: ./services/alert-engine
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [ioteca]

  quota-service:
    build: ./services/quota-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ioteca]

  notification-service:
    build: ./services/notification-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [ioteca]

  mqtt-bridge:
    build: ./services/mqtt-bridge
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    networks: [ioteca]

  api-gateway:
    build: ./services/api-gateway
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [ioteca]

  # ── Frontend ─────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks: [ioteca]

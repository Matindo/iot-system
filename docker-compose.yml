name: ioteca

networks:
  ioteca:
    driver: bridge

volumes:
  timescaledb-data:
  redis-data:
  kafka-data:
  emqx-data:

services:

  # ── Infrastructure ──────────────────────────────────────────────

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ioteca
      POSTGRES_USER: ioteca
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    networks: [ioteca]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [ioteca]

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092, EXTERNAL://kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./infra/kafka/init.sh:/kafka-init.sh:ro
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--describe", "--topic", "raw.ingest.af-ke-1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [ioteca]

  emqx:
    image: emqx/emqx:5.6.0
    restart: unless-stopped
    user: root
    ports:
      - "1883:1883"
      - "8083:8083"
      - "127.0.0.1:18083:18083"
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_INTERNAL_SECRET: ${EMQX_INTERNAL_SECRET}
    volumes:
      - emqx-data:/opt/emqx/data
      - ./infra/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    networks: [ioteca]

  # ── Backend Services ─────────────────────────────────────────────

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    env_file: .env
    depends_on: [timescaledb]
    networks: [ioteca]

  ingestion-service:
    build: ./services/ingestion-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_started
    networks: [ioteca]

  alert-engine:
    build: ./services/alert-engine
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_started
    networks: [ioteca]

  quota-service:
    build: ./services/quota-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [ioteca]

  notification-service:
    build: ./services/notification-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
    networks: [ioteca]

  mqtt-bridge:
    build: ./services/mqtt-bridge
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    networks: [ioteca]

  api-gateway:
    build: ./services/api-gateway
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
      timescaledb:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    networks: [ioteca]

  # ── Frontend ─────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks: [ioteca]
